# Dùng nếu bạn muốn Nginx thay cho Caddy. Đặt TRUST_PROXY=1 cho ứng dụng.
# Chứng chỉ: certbot --nginx -d chamcong.congty.vn
server {
    listen 80;
    server_name chamcong.congty.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chamcong.congty.vn;

    ssl_certificate     /etc/letsencrypt/live/chamcong.congty.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chamcong.congty.vn/privkey.pem;

    client_max_body_size 8m;   # ảnh chụp khi chấm công, file CSV nhập nhân viên

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
